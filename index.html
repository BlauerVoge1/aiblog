<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="blauervogel 的个人博客 - 基于 GitHub Issues 的轻量博客">
<title>blauervogel</title>
<style>
:root {
  --bg: #f8f9fa;
  --card: #fff;
  --text: #2c3e50;
  --text-light: #6c757d;
  --border: #e9ecef;
  --accent: #4a90d9;
  --accent-hover: #357abd;
  --danger: #e74c3c;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
.header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.header-inner { max-width: 800px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 1.4rem; font-weight: 600; cursor: pointer; }
.header h1 span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn { padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: .88rem; transition: all .2s; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-sm { padding: 4px 10px; font-size: .8rem; }

/* Container */
.container { max-width: 800px; margin: 0 auto; padding: 20px; }

/* Post List */
.post-card { background: var(--card); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 14px; box-shadow: var(--shadow); cursor: pointer; transition: transform .15s; border: 1px solid var(--border); }
.post-card:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.post-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.post-meta { font-size: .82rem; color: var(--text-light); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.post-excerpt { margin-top: 8px; font-size: .9rem; color: var(--text-light); }
.post-labels { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.label { background: #e8f0fe; color: var(--accent); padding: 2px 10px; border-radius: 12px; font-size: .75rem; }

/* Pagination */
.pagination { display: flex; justify-content: center; gap: 8px; margin: 24px 0; }
.pagination .btn { min-width: 36px; text-align: center; }
.pagination .active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Post Detail */
.post-detail { background: var(--card); border-radius: var(--radius); padding: 28px 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.post-detail h1 { font-size: 1.6rem; margin-bottom: 10px; }
.post-content { margin-top: 20px; font-size: 1rem; line-height: 1.9; }
.post-content h1, .post-content h2, .post-content h3 { margin: 24px 0 12px; }
.post-content p { margin: 12px 0; }
.post-content ul, .post-content ol { padding-left: 24px; margin: 8px 0; }
.post-content li { margin: 4px 0; }
.post-content code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-size: .9em; }
.post-content pre { background: #282c34; color: #abb2bf; padding: 16px; border-radius: var(--radius); overflow-x: auto; margin: 12px 0; }
.post-content pre code { background: none; padding: 0; color: inherit; }
.post-content blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-light); margin: 12px 0; }
.post-content img { max-width: 100%; border-radius: var(--radius); }
.post-content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
.post-content th, .post-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.post-content th { background: var(--bg); }
.post-actions { margin-top: 16px; display: flex; gap: 8px; }

/* Comments */
.comments { margin-top: 28px; }
.comments h3 { font-size: 1.1rem; margin-bottom: 14px; }
.comment { background: var(--bg); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.comment-header { font-size: .82rem; color: var(--text-light); margin-bottom: 6px; }
.comment-body { font-size: .93rem; }
.comment-body p { margin: 4px 0; }
.comment-form { margin-top: 14px; display: flex; gap: 8px; }
.comment-form input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; }
.comment-form input:focus { outline: none; border-color: var(--accent); }

/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 200; justify-content: center; align-items: flex-start; padding-top: 60px; }
.modal-overlay.active { display: flex; }
.modal { background: var(--card); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.modal h2 { margin-bottom: 16px; }
.modal label { display: block; font-size: .9rem; font-weight: 500; margin: 12px 0 6px; }
.modal input, .modal textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; font-family: inherit; }
.modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
.modal textarea { min-height: 200px; resize: vertical; }
.modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Loading & Error */
.loading { text-align: center; padding: 60px 20px; color: var(--text-light); }
.spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-icon { font-size: 3rem; margin-bottom: 12px; }
.error { background: #fff3cd; color: #856404; padding: 12px 16px; border-radius: var(--radius); margin: 12px 0; }

/* Token Bar */
.token-bar { background: #fff3cd; padding: 10px 20px; text-align: center; font-size: .85rem; border-bottom: 1px solid #ffc107; display: none; }
.token-bar.active { display: block; }
.token-bar input { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; width: 300px; max-width: 60%; font-size: .85rem; }
.token-bar .btn { padding: 4px 10px; font-size: .8rem; margin-left: 6px; }

/* User badge */
.user-badge { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; padding: 4px 10px; border-radius: var(--radius); background: #e8f0fe; cursor: pointer; }
.user-badge .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 600; overflow: hidden; }
.user-badge .avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Login modal */
.login-modal .tabs { margin-bottom: 16px; }
.login-modal .tab-content { display: none; }
.login-modal .tab-content.active { display: block; }
.login-modal input { margin-bottom: 8px; }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tab { padding: 8px 16px; cursor: pointer; border: none; background: none; font-size: .9rem; color: var(--text-light); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

/* Search */
.search-bar { margin-bottom: 16px; }
.search-bar input { width: 100%; padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; }
.search-bar input:focus { outline: none; border-color: var(--accent); }

/* Back link */
.back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--text-light); font-size: .9rem; cursor: pointer; margin-bottom: 14px; }
.back-link:hover { color: var(--accent); }

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1a2e; --card: #16213e; --text: #e0e0e0; --text-light: #a0a0a0; --border: #2a2a4a; --shadow: 0 1px 3px rgba(0,0,0,.3); }
  .label { background: #1a3a5c; }
  .post-content code { background: #2a2a4a; }
  .post-content blockquote { border-left-color: var(--accent); }
  .comment { background: #1a1a2e; }
  .btn { background: var(--card); color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; }
  .empty { color: var(--text-light); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1 onclick="showList()">blauer<span>vogel</span></h1>
    <div class="header-actions">
      <span id="admin-indicator" style="display:none;font-size:.78rem;color:#27ae60;">admin</span>
      <span id="user-badge" class="user-badge" style="display:none;" onclick="showLoginModal()" title="点击切换账号">
        <span class="avatar" id="user-avatar">?</span>
        <span id="user-name-display"></span>
      </span>
      <button class="btn btn-sm" id="login-btn" onclick="showLoginModal()">登录</button>
      <button class="btn btn-sm" id="token-btn" onclick="showTokenBar()">管理</button>
      <button class="btn btn-primary btn-sm" id="new-post-btn" style="display:none;" onclick="showEditor()">写文章</button>
      <button class="btn btn-sm" onclick="location.reload()">刷新</button>
    </div>
  </div>
</div>
<div class="token-bar" id="token-bar">
  输入 GitHub Token 以管理文章：
  <input type="password" id="token-input" placeholder="ghp_...">
  <button class="btn btn-primary btn-sm" onclick="saveToken()">保存</button>
  <button class="btn btn-sm" onclick="clearToken()">清除</button>
  <small style="color:#856404;">Token 仅存于浏览器本地</small>
</div>

<div class="container" id="app">
  <div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中…</p></div>
</div>

<!-- Editor Modal -->
<div class="modal-overlay" id="editor-modal">
  <div class="modal">
    <h2 id="editor-title">写文章</h2>
    <label>标题</label>
    <input type="text" id="post-title" placeholder="文章标题...">
    <label>标签（逗号分隔）</label>
    <input type="text" id="post-labels" placeholder="技术, 生活">
    <label>内容（支持 Markdown）</label>
    <textarea id="post-body" placeholder="在这里写 Markdown..."></textarea>
    <div class="btn-row">
      <button class="btn" onclick="closeEditor()">取消</button>
      <button class="btn btn-primary" id="editor-submit" onclick="savePost()">发布</button>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay login-modal" id="login-modal">
  <div class="modal" style="max-width:400px;">
    <div class="tabs">
      <button class="tab active" onclick="switchLoginTab('login')">登录</button>
      <button class="tab" onclick="switchLoginTab('register')">注册</button>
      <button class="tab" onclick="switchLoginTab('qq')">QQ登录</button>
    </div>
    <div class="tab-content active" id="tab-login">
      <label>用户名</label>
      <input type="text" id="login-username" placeholder="用户名...">
      <label>密码</label>
      <input type="password" id="login-password" placeholder="密码...">
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" onclick="closeLoginModal()">取消</button>
        <button class="btn btn-primary" id="login-submit" onclick="doLogin()">登录</button>
      </div>
      <p style="font-size:.8rem;color:var(--text-light);margin-top:8px;">没有账号？点击「注册」创建</p>
    </div>
    <div class="tab-content" id="tab-register">
      <label>用户名</label>
      <input type="text" id="register-username" placeholder="用户名（字母开头，4-16位）...">
      <label>密码</label>
      <input type="password" id="register-password" placeholder="密码（至少6位）...">
      <label>确认密码</label>
      <input type="password" id="register-password2" placeholder="再次输入密码...">
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" onclick="closeLoginModal()">取消</button>
        <button class="btn btn-primary" id="register-submit" onclick="doRegister()">注册</button>
      </div>
      <p style="font-size:.8rem;color:var(--text-light);margin-top:8px;">注册后即可发表评论，密码加密存储</p>
    </div>
    <div class="tab-content" id="tab-qq">
      <label>QQ 号</label>
      <input type="text" id="qq-number" placeholder="输入你的 QQ 号...">
      <label>昵称</label>
      <input type="text" id="qq-nickname" placeholder="你的昵称...">
      <div id="qq-avatar-preview" style="text-align:center;margin:8px 0;display:none;">
        <img id="qq-avatar-img" src="" style="width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);" onerror="this.style.display='none';document.getElementById('qq-avatar-preview').style.display='none';">
        <p style="font-size:.75rem;color:var(--text-light);">QQ 头像</p>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" onclick="closeLoginModal()">取消</button>
        <button class="btn btn-primary" onclick="doQQLogin()">QQ 登录</button>
      </div>
      <p style="font-size:.78rem;color:var(--text-light);margin-top:8px;">输入 QQ 号即可自动获取头像，无需密码</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<script>
const OWNER = 'BlauerVoge1';
const REPO = 'aiblog';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const BLOG_LABEL = 'blog';
const PAGES_URL = `https://blauervoge1.github.io/aiblog`;

// CloudBase config
const TCB_ENV = 'robot-d5g5bfzigbc61c975';
let tcbApp = null;
let tcbAuth = null;
let tcbDb = null;

// Init CloudBase
try {
  tcbApp = cloudbase.init({ env: TCB_ENV });
  tcbAuth = tcbApp.auth({ persistence: 'local' });
  tcbDb = tcbApp.database();
} catch(e) { console.log('CloudBase init error:', e); }

let page = 1;
let currentIssue = null;
let editingId = null;

// ==================== State ====================

function getToken() { return localStorage.getItem('gh_token') || ''; }
function isAdmin() { return !!localStorage.getItem('gh_token'); }
function getNickname() {
  if (tcbAuth && tcbAuth.currentUser) return tcbAuth.currentUser.username || '';
  if (localStorage.getItem('aiblog_qq')) return localStorage.getItem('aiblog_qq_nickname') || '';
  return localStorage.getItem('aiblog_nickname') || '';
}
function isLoggedIn() { return (tcbAuth && tcbAuth.currentUser) || !!getNickname() || isAdmin(); }
function getDisplayName() { return isAdmin() ? '管理员' : getNickname(); }
function getQQ() { return localStorage.getItem('aiblog_qq') || ''; }
function getQQAvatar() {
  const qq = getQQ();
  return qq ? `https://q.qlogo.cn/headimg_dl?dst_uin=${qq}&spec=100` : '';
}

function headers() {
  const t = getToken();
  const h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}

// Parse query params
function getParam(name) {
  const p = new URLSearchParams(location.search);
  return p.get(name);
}

// ==================== UI ====================

function updateAdminUI() {
  const admin = isAdmin();
  const nick = getNickname();
  document.getElementById('new-post-btn').style.display = admin ? '' : 'none';
  document.getElementById('admin-indicator').style.display = admin ? '' : 'none';
  document.getElementById('token-btn').textContent = admin ? '管理 ✓' : '管理';

  // User badge
  const badge = document.getElementById('user-badge');
  const loginBtn = document.getElementById('login-btn');
  const avatarEl = document.getElementById('user-avatar');
  if (admin) {
    badge.style.display = 'inline-flex';
    loginBtn.style.display = 'none';
    avatarEl.innerHTML = 'A';
    document.getElementById('user-name-display').textContent = '管理员';
  } else if (nick) {
    badge.style.display = 'inline-flex';
    loginBtn.style.display = 'none';
    const qqAvatar = getQQAvatar();
    if (qqAvatar) {
      avatarEl.innerHTML = `<img src="${qqAvatar}" alt="">`;
    } else {
      avatarEl.textContent = nick.charAt(0).toUpperCase();
    }
    document.getElementById('user-name-display').textContent = nick;
  } else {
    badge.style.display = 'none';
    loginBtn.style.display = '';
  }
}

function showTokenBar() {
  document.getElementById('token-bar').classList.toggle('active');
  if (getToken()) document.getElementById('token-input').value = getToken();
}

function saveToken() {
  const v = document.getElementById('token-input').value.trim();
  if (v) {
    localStorage.setItem('gh_token', v);
    document.getElementById('token-bar').classList.remove('active');
    updateAdminUI();
    if (currentIssue) showPost(currentIssue.number);
    else showList();
  }
}

function clearToken() {
  localStorage.removeItem('gh_token');
  document.getElementById('token-input').value = '';
  updateAdminUI();
  if (currentIssue) showPost(currentIssue.number);
  else showList();
}

// ==================== Login / Register ====================

function showLoginModal() {
  document.getElementById('login-username').value = getNickname();
  document.getElementById('login-password').value = '';
  document.getElementById('register-username').value = '';
  document.getElementById('register-password').value = '';
  document.getElementById('register-password2').value = '';
  document.getElementById('qq-number').value = localStorage.getItem('aiblog_qq') || '';
  document.getElementById('qq-nickname').value = localStorage.getItem('aiblog_qq_nickname') || '';

  if (localStorage.getItem('aiblog_qq')) {
    switchLoginTab('qq');
    const qq = localStorage.getItem('aiblog_qq');
    document.getElementById('qq-avatar-img').src = `https://q.qlogo.cn/headimg_dl?dst_uin=${qq}&spec=100`;
    document.getElementById('qq-avatar-preview').style.display = '';
  } else {
    switchLoginTab('login');
  }

  document.getElementById('login-modal').classList.add('active');
}

function closeLoginModal() {
  document.getElementById('login-modal').classList.remove('active');
}

function switchLoginTab(tab) {
  const tabs = { 'login': 0, 'register': 1, 'qq': 2 };
  document.querySelectorAll('#login-modal .tab').forEach((t, i) => {
    t.classList.toggle('active', tabs[tab] === i);
  });
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('tab-qq').classList.toggle('active', tab === 'qq');

  if (tab === 'qq') {
    const qqInput = document.getElementById('qq-number');
    if (!qqInput._listener) {
      qqInput._listener = true;
      qqInput.addEventListener('input', function() {
        const qq = this.value.trim();
        const preview = document.getElementById('qq-avatar-preview');
        const img = document.getElementById('qq-avatar-img');
        if (/^\d{5,11}$/.test(qq)) {
          img.src = `https://q.qlogo.cn/headimg_dl?dst_uin=${qq}&spec=100`;
          preview.style.display = '';
        } else {
          preview.style.display = 'none';
        }
      });
    }
  }
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();
  if (!username || !password) { alert('请输入用户名和密码'); return; }

  if (!tcbAuth) { alert('CloudBase 未初始化，请刷新页面'); return; }

  const btn = document.getElementById('login-submit');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    await tcbAuth.signInWithPassword({ username, password });
    localStorage.removeItem('aiblog_nickname');
    localStorage.removeItem('aiblog_qq');
    localStorage.removeItem('aiblog_qq_nickname');
    closeLoginModal();
    updateAdminUI();
    refreshCurrent();
  } catch (e) {
    alert('登录失败: ' + (e.message || e));
  }
  btn.disabled = false; btn.textContent = '登录';
}

async function doRegister() {
  const username = document.getElementById('register-username').value.trim();
  const password = document.getElementById('register-password').value.trim();
  const password2 = document.getElementById('register-password2').value.trim();

  if (!username) { alert('请输入用户名'); return; }
  if (!/^[a-zA-Z]/.test(username)) { alert('用户名必须以字母开头'); return; }
  if (username.length < 3 || username.length > 16) { alert('用户名长度 3-16 位'); return; }
  if (!password) { alert('请输入密码'); return; }
  if (password.length < 6) { alert('密码至少 6 位'); return; }
  if (password !== password2) { alert('两次密码不一致'); return; }

  if (!tcbAuth) { alert('CloudBase 未初始化，请刷新页面'); return; }

  const btn = document.getElementById('register-submit');
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    await tcbAuth.signUp({ username, password });
    alert('注册成功！已自动登录');
    localStorage.removeItem('aiblog_nickname');
    localStorage.removeItem('aiblog_qq');
    localStorage.removeItem('aiblog_qq_nickname');
    closeLoginModal();
    updateAdminUI();
    refreshCurrent();
  } catch (e) {
    alert('注册失败: ' + (e.message || e));
  }
  btn.disabled = false; btn.textContent = '注册';
}

function doQQLogin() {
  const qq = document.getElementById('qq-number').value.trim();
  const nick = document.getElementById('qq-nickname').value.trim();
  if (!qq) { alert('请输入 QQ 号'); return; }
  if (!/^\d{5,11}$/.test(qq)) { alert('请输入正确的 QQ 号'); return; }
  if (!nick) { alert('请输入昵称'); return; }
  localStorage.setItem('aiblog_qq', qq);
  localStorage.setItem('aiblog_qq_nickname', nick);
  localStorage.removeItem('aiblog_nickname');
  closeLoginModal();
  updateAdminUI();
  refreshCurrent();
}

function doLogout() {
  if (confirm('确定退出登录？')) {
    localStorage.removeItem('aiblog_nickname');
    localStorage.removeItem('aiblog_qq');
    localStorage.removeItem('aiblog_qq_nickname');
    localStorage.removeItem('gh_token');
    if (tcbAuth) tcbAuth.signOut().catch(() => {});
    updateAdminUI();
    refreshCurrent();
  }
}

function refreshCurrent() {
  if (currentIssue) showPost(currentIssue.number);
  else showList();
}

// ==================== Posts ====================

async function fetchPosts(pageNum = 1) {
  const q = getParam('q') || '';
  const perPage = 10;
  let url;

  if (q) {
    url = `https://api.github.com/search/issues?q=${encodeURIComponent(q)}+repo:${OWNER}/${REPO}+label:${BLOG_LABEL}+state:open&sort=updated&order=desc&page=${pageNum}&per_page=${perPage}`;
  } else {
    url = `${API}/issues?labels=${BLOG_LABEL}&state=open&sort=created&direction=desc&page=${pageNum}&per_page=${perPage}`;
  }

  const r = await fetch(url, { headers: headers() });
  if (!r.ok) throw new Error(`GitHub API: ${r.status}`);

  if (q) {
    const d = await r.json();
    return { items: d.items, total: d.total_count };
  }
  const items = await r.json();
  return { items, total: items.length < perPage ? (pageNum - 1) * perPage + items.length : 999 };
}

async function fetchPost(number) {
  const r = await fetch(`${API}/issues/${number}`, { headers: headers() });
  if (!r.ok) throw new Error(`Post not found: ${r.status}`);
  return r.json();
}

async function fetchComments(number) {
  const r = await fetch(`${API}/issues/${number}/comments`, { headers: headers() });
  if (!r.ok) return [];
  return r.json();
}

async function savePost() {
  const title = document.getElementById('post-title').value.trim();
  const body = document.getElementById('post-body').value.trim();
  const labelsInput = document.getElementById('post-labels').value.trim();

  if (!title || !body) { alert('标题和内容不能为空'); return; }

  const labels = [BLOG_LABEL];
  if (labelsInput) labels.push(...labelsInput.split(',').map(s => s.trim()).filter(Boolean));

  const token = getToken();
  if (!token) { alert('请先设置 GitHub Token'); return; }

  const btn = document.getElementById('editor-submit');
  btn.disabled = true; btn.textContent = '发布中...';

  try {
    let r;
    if (editingId) {
      r = await fetch(`${API}/issues/${editingId}`, {
        method: 'PATCH', headers: headers(),
        body: JSON.stringify({ title, body, labels })
      });
    } else {
      r = await fetch(`${API}/issues`, {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ title, body, labels })
      });
    }
    if (!r.ok) { const e = await r.json(); throw new Error(e.message); }
    const issue = await r.json();
    closeEditor();
    showPost(issue.number, true);
  } catch (e) {
    alert('保存失败: ' + e.message);
  }
  btn.disabled = false; btn.textContent = editingId ? '更新' : '发布';
}

async function deletePost(number) {
  if (!confirm('确定删除这篇文章？')) return;
  try {
    const r = await fetch(`${API}/issues/${number}`, {
      method: 'PATCH', headers: headers(),
      body: JSON.stringify({ state: 'closed' })
    });
    if (!r.ok) throw new Error('Delete failed');
    showList();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

async function addComment(number) {
  const input = document.getElementById('comment-input');
  const body = input.value.trim();
  if (!body) return;

  if (!isLoggedIn()) { alert('请先登录才能评论'); showLoginModal(); return; }
 
  // Check CloudBase auth specifically for database write
  if (!tcbAuth || !tcbAuth.currentUser) {
    alert('需要注册账号才能评论，请点击登录 → 注册');
    showLoginModal();
    switchLoginTab('register');
    return;
  }

  if (!tcbDb) { alert('数据库未初始化，请刷新页面'); return; }

  const displayName = getDisplayName();
  try {
    await tcbDb.collection('blog_comments').add({
      post_id: String(number),
      username: displayName,
      body: body,
      created_at: new Date().toISOString()
    });
    input.value = '';
    showPost(number, true);
  } catch (e) {
    const msg = e.message || e.code || String(e);
    if (msg.includes('PERMISSION_DENIED') || msg.includes('ACCESS_TOKEN') || msg.includes('unauthenticated') || msg.includes('auth')) {
      alert('评论失败: 请先登录后再评论');
    } else {
      alert('评论失败: ' + msg);
    }
    console.error('Comment error:', e);
  }
}

async function fetchCommentsFromTCB(postId) {
  if (!tcbDb) return [];
  try {
    const res = await tcbDb.collection('blog_comments')
      .where({ post_id: String(postId) })
      .orderBy('created_at', 'asc')
      .get();
    return res.data || [];
  } catch (e) {
    console.log('Comment fetch error:', e);
    return [];
  }
}

// ==================== Render ====================

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 2592000) return Math.floor(diff / 86400) + ' 天前';
  return d.toLocaleDateString('zh-CN');
}

function formatDate(dateStr) {
  return new Date(dateStr).toLocaleString('zh-CN');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// 从评论 body 中提取显示名和纯内容
// 格式: **显示名**：正文 或 **显示名**（QQ:123）：正文
function parseCommentMeta(body) {
  const m = body.match(/^\*\*(.+?)\*\*(?:（QQ:\d+）)?[：:]/);
  if (m) {
    const displayName = m[1];
    const content = body.substring(m[0].length).trim();
    return { displayName, content };
  }
  return { displayName: '匿名', content: body };
}

function renderList(data) {
  const items = data.items;
  page = getParam('page') ? parseInt(getParam('page')) : 1;
  const q = getParam('q') || '';

  let html = '';

  // Search
  html += `<div class="search-bar"><input type="text" id="search-input" placeholder="搜索文章..." value="${escapeHtml(q)}" onkeydown="if(event.key==='Enter')searchPosts()"></div>`;

  // Posts
  if (!items || items.length === 0) {
    html += `<div class="empty"><div class="empty-icon">📝</div><p>还没有文章</p></div>`;
  } else {
    items.forEach(issue => {
      const labels = issue.labels.filter(l => l.name !== BLOG_LABEL).map(l => l.name);
      const labelHtml = labels.map(l => `<span class="label">#${escapeHtml(l)}</span>`).join('');
      const excerpt = (issue.body || '').substring(0, 150).replace(/[#*`\n\r]/g, ' ').trim();
      html += `
        <div class="post-card" onclick="showPost(${issue.number})">
          <div class="post-title">${escapeHtml(issue.title)}</div>
          <div class="post-meta">
            <span>${timeAgo(issue.created_at)}</span>
            <span>💬 ${issue.comments}</span>
          </div>
          ${excerpt ? `<div class="post-excerpt">${escapeHtml(excerpt)}...</div>` : ''}
          ${labelHtml ? `<div class="post-labels">${labelHtml}</div>` : ''}
        </div>`;
    });

    // Pagination
    if (data.total > 10) {
      const totalPages = Math.ceil(Math.min(data.total, 100) / 10);
      const current = page;
      html += '<div class="pagination">';
      if (current > 1) html += `<button class="btn btn-sm" onclick="goPage(${current - 1})">上一页</button>`;
      for (let i = Math.max(1, current - 2); i <= Math.min(totalPages, current + 2); i++) {
        html += `<button class="btn btn-sm ${i === current ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      if (current < totalPages) html += `<button class="btn btn-sm" onclick="goPage(${current + 1})">下一页</button>`;
      html += '</div>';
    }
  }

  document.getElementById('app').innerHTML = html;
  document.getElementById('app').scrollIntoView();
}

async function renderPost(issue, comments) {
  currentIssue = issue;
  const labels = issue.labels.filter(l => l.name !== BLOG_LABEL).map(l => l.name);
  const labelHtml = labels.map(l => `<span class="label">#${escapeHtml(l)}</span>`).join('');
  const admin = isAdmin();
  const issueUrl = issue.html_url;

  let bodyHtml = '';
  try {
    bodyHtml = marked.parse(issue.body || '');
  } catch (e) {
    bodyHtml = `<pre>${escapeHtml(issue.body || '')}</pre>`;
  }

  let html = `
    <div class="back-link" onclick="showList()">← 返回列表</div>
    <div class="post-detail">
      <h1>${escapeHtml(issue.title)}</h1>
      <div class="post-meta">
        <span>${formatDate(issue.created_at)}</span>
        <span>💬 ${comments.length} 条评论</span>
        <a href="${issueUrl}" target="_blank" style="font-size:.8rem;">GitHub ↗</a>
      </div>
      ${labelHtml ? `<div class="post-labels">${labelHtml}</div>` : ''}
      <div class="post-content">${bodyHtml}</div>
      ${admin ? `<div class="post-actions">
        <button class="btn btn-sm" onclick="editPost(${issue.number})">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deletePost(${issue.number})">删除</button>
      </div>` : ''}
    </div>

    <div class="comments">
      <h3>评论 (${comments.length})</h3>`;

  if (comments.length === 0) {
    html += `<p style="color:var(--text-light);font-size:.9rem;">暂无评论</p>`;
  } else {
    comments.forEach(c => {
      const displayName = c.username || '匿名';
      const body = c.body || '';
      let cbody = '';
      try { cbody = marked.parse(body); } catch (e) { cbody = escapeHtml(body); }
      html += `
        <div class="comment">
          <div class="comment-header">
            <strong>${escapeHtml(displayName)}</strong> · ${timeAgo(c.created_at)}
          </div>
          <div class="comment-body">${cbody}</div>
        </div>`;
    });
  }

  html += `
      <div class="comment-form">
        <input type="text" id="comment-input" placeholder="${isLoggedIn() ? '写下你的评论...' : '请先登录再评论'}">
        <button class="btn btn-primary btn-sm" onclick="addComment(${issue.number})" ${isLoggedIn() ? '' : 'disabled'}>发送</button>
        ${!isLoggedIn() ? '<button class="btn btn-sm" onclick="showLoginModal()" style="margin-left:4px;">登录</button>' : ''}
      </div>
    </div>`;

  document.getElementById('app').innerHTML = html;
  document.getElementById('app').scrollIntoView();
}

// ==================== Navigation ====================

async function showList() {
  currentIssue = null;
  updateAdminUI();
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中…</p></div>';

  const q = getParam('q') || '';
  let url;
  if (q) {
    url = `?q=${encodeURIComponent(q)}`;
  } else {
    url = '';
  }
  history.pushState(null, '', url);

  try {
    const data = await fetchPosts(page);
    renderList(data);
  } catch (e) {
    app.innerHTML = `<div class="error">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

async function showPost(number, skipPush) {
  updateAdminUI();
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中…</p></div>';

  if (!skipPush) history.pushState(null, '', `?p=${number}`);

  try {
    const [issue, comments] = await Promise.all([fetchPost(number), fetchCommentsFromTCB(number)]);
    await renderPost(issue, comments);
  } catch (e) {
    app.innerHTML = `<div class="error">加载失败: ${escapeHtml(e.message)}<br><button class="btn btn-sm" style="margin-top:8px" onclick="showList()">返回列表</button></div>`;
  }
}

function goPage(n) {
  page = n;
  showList();
}

function searchPosts() {
  const q = document.getElementById('search-input').value.trim();
  if (q) {
    history.pushState(null, '', `?q=${encodeURIComponent(q)}`);
  } else {
    history.pushState(null, '', '');
  }
  page = 1;
  showList();
}

// ==================== Editor ====================

function showEditor() {
  editingId = null;
  document.getElementById('editor-title').textContent = '写文章';
  document.getElementById('editor-submit').textContent = '发布';
  document.getElementById('post-title').value = '';
  document.getElementById('post-labels').value = '';
  document.getElementById('post-body').value = '';
  document.getElementById('editor-modal').classList.add('active');
}

function closeEditor() {
  document.getElementById('editor-modal').classList.remove('active');
  editingId = null;
}

async function editPost(number) {
  try {
    const issue = await fetchPost(number);
    editingId = number;
    document.getElementById('editor-title').textContent = '编辑文章';
    document.getElementById('editor-submit').textContent = '更新';
    document.getElementById('post-title').value = issue.title;
    document.getElementById('post-body').value = issue.body || '';
    const labels = issue.labels.filter(l => l.name !== BLOG_LABEL).map(l => l.name).join(', ');
    document.getElementById('post-labels').value = labels;
    document.getElementById('editor-modal').classList.add('active');
  } catch (e) {
    alert('加载失败: ' + e.message);
  }
}

// ==================== Init ====================

document.addEventListener('DOMContentLoaded', async () => {
  // Recover CloudBase session
  if (tcbAuth) {
    try {
      const loginState = await tcbAuth.getLoginState();
      if (loginState) {
        await tcbAuth.tryAuthInWeb();
      }
    } catch (e) { /* no existing session */ }
  }
  updateAdminUI();

  // Close modal on overlay click
  document.getElementById('editor-modal').addEventListener('click', function(e) {
    if (e.target === this) closeEditor();
  });
  document.getElementById('login-modal').addEventListener('click', function(e) {
    if (e.target === this) closeLoginModal();
  });

  // Route on load
  const pId = getParam('p');
  if (pId) {
    showPost(parseInt(pId));
  } else {
    showList();
  }
});

// Close modal on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeEditor(); closeLoginModal(); }
});

// Handle back/forward
window.addEventListener('popstate', () => {
  const pId = getParam('p');
  if (pId) showPost(parseInt(pId));
  else showList();
});
</script>
