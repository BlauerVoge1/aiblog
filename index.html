<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue's Blog</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #fafaf7;
  --bg-card: #fff;
  --bg-hover: #f5f4f0;
  --text: #222;
  --text-light: #777;
  --border: #e8e6e0;
  --accent: #3366cc;
  --accent-hover: #2549a0;
  --tag-bg: #edf2fb;
  --tag-text: #3366cc;
  --danger: #d32f2f;
  --danger-hover: #b71c1c;
  --radius: 10px;
  --max-w: 720px;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh;
}
.header {
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  padding: 0 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-inner {
  max-width: var(--max-w); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; height: 52px;
}
.header-left { display: flex; align-items: center; gap: 18px; }
.site-title { font-size: 1.15rem; font-weight: 600; color: var(--text); text-decoration: none; }
.site-title:hover { color: var(--accent); }
.nav-links { display: flex; gap: 12px; }
.nav-links a { font-size: .85rem; color: var(--text-light); text-decoration: none; }
.nav-links a:hover { color: var(--accent); }

.user-badge { display: none; align-items: center; gap: 8px; cursor: pointer; position: relative; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--tag-bg); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; font-weight: 600; overflow: hidden;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-name { font-size: .85rem; font-weight: 500; }
.user-dropdown {
  display: none; position: absolute; top: 44px; right: 0;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.1);
  min-width: 160px; z-index: 200; overflow: hidden;
}
.user-badge.open .user-dropdown { display: block; }
.login-btn {
  padding: 6px 16px; background: var(--accent); color: #fff;
  border: none; border-radius: 6px; font-size: .85rem; cursor: pointer;
}
.login-btn:hover { background: var(--accent-hover); }

.token-bar {
  display: none; background: #fff8e1; border-bottom: 1px solid #ffe082;
  padding: 8px 20px; font-size: .82rem;
}
.token-bar-inner {
  max-width: var(--max-w); margin: 0 auto; display: flex; align-items: center; gap: 8px;
}
.token-bar input { flex: 1; padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: .8rem; }
.token-bar button { padding: 5px 14px; border: none; border-radius: 5px; font-size: .8rem; cursor: pointer; }
.token-bar .save-btn { background: var(--accent); color: #fff; }
.token-bar .save-btn:hover { background: var(--accent-hover); }
.token-bar .clear-btn { background: none; color: var(--danger); }
.token-bar .admin-label { color: #8d6e00; font-weight: 600; margin-right: 6px; }

.main { max-width: var(--max-w); margin: 0 auto; padding: 24px 20px; }

.post-item {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 24px; margin-bottom: 14px;
  cursor: pointer; transition: box-shadow .15s;
}
.post-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.post-item h2 { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }
.post-meta { display: flex; gap: 16px; font-size: .78rem; color: var(--text-light); flex-wrap: wrap; }
.post-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.post-tag {
  padding: 2px 10px; background: var(--tag-bg); color: var(--tag-text);
  border-radius: 12px; font-size: .72rem;
}

.post-detail { display: none; }
.post-detail-header { margin-bottom: 20px; }
.post-detail-header h1 { font-size: 1.5rem; margin-bottom: 8px; }
.post-content {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
  font-size: .95rem; line-height: 1.8;
}
.post-content h1, .post-content h2, .post-content h3 { margin-top: 1.2em; margin-bottom: .5em; }
.post-content p { margin-bottom: .8em; }
.post-content code { background: #f0efe8; padding: 2px 6px; border-radius: 4px; font-size: .88em; }
.post-content pre { background: #f0efe8; padding: 14px 18px; border-radius: var(--radius); overflow-x: auto; margin: 10px 0; }
.post-content pre code { background: none; padding: 0; }
.post-content img { max-width: 100%; border-radius: 6px; }
.post-content blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-light); margin: 10px 0; }
.post-content a { color: var(--accent); }
.post-content ul, .post-content ol { padding-left: 20px; margin-bottom: .8em; }
.back-link { color: var(--accent); cursor: pointer; font-size: .88rem; margin-bottom: 14px; display: inline-block; }

.comments-section { margin-top: 24px; }
.comments-section h3 { font-size: 1rem; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.comment-item {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 10px;
}
.comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.comment-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--tag-bg); display: flex; align-items: center; justify-content: center;
  font-size: .68rem; font-weight: 600; overflow: hidden;
}
.comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.comment-author { font-size: .85rem; font-weight: 500; }
.comment-time { font-size: .72rem; color: var(--text-light); }
.comment-body { font-size: .9rem; line-height: 1.6; margin-left: 36px; }

.comment-form {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-top: 16px;
}
.comment-form textarea {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-size: .9rem; font-family: inherit;
  resize: vertical; min-height: 80px; line-height: 1.6;
}
.comment-form textarea:focus { outline: none; border-color: var(--accent); }
.comment-form .comment-actions {
  display: flex; align-items: center; justify-content: space-between; margin-top: 10px;
}
.comment-form .comment-hint { font-size: .78rem; color: var(--text-light); }
.comment-form .comment-hint a { color: var(--accent); cursor: pointer; text-decoration: none; }
.comment-form .submit-btn {
  padding: 7px 22px; background: var(--accent); color: #fff;
  border: none; border-radius: 6px; font-size: .88rem; cursor: pointer;
}
.comment-form .submit-btn:hover { background: var(--accent-hover); }
.comment-form .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.4); align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-card); border-radius: 14px; padding: 28px;
  width: 380px; max-width: 94vw; box-shadow: 0 8px 32px rgba(0,0,0,.15);
}
.modal h2 { font-size: 1.15rem; margin-bottom: 18px; text-align: center; }

.tabs { display: flex; margin-bottom: 18px; border-bottom: 2px solid var(--border); }
.tab {
  flex: 1; padding: 8px 0; border: none; background: none;
  font-size: .92rem; cursor: pointer; color: var(--text-light);
  border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .82rem; color: var(--text-light); margin-bottom: 4px; }
.form-group input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: .9rem; font-family: inherit;
}
.form-group input:focus { outline: none; border-color: var(--accent); }
.btn-row { display: flex; gap: 8px; justify-content: flex-end; }
.btn {
  padding: 8px 22px; border: 1px solid var(--border);
  border-radius: 8px; font-size: .9rem; cursor: pointer; background: var(--bg-card);
}
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover { background: var(--danger-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.admin-controls { display: none; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
.admin-controls .new-post-btn {
  padding: 8px 20px; background: #2e7d32; color: #fff;
  border: none; border-radius: 8px; font-size: .88rem; cursor: pointer;
}
.admin-controls .new-post-btn:hover { background: #1b5e20; }

.page-info { text-align: center; padding: 20px; color: var(--text-light); font-size: .85rem; }
.loading { text-align: center; padding: 40px; color: var(--text-light); }
.empty { text-align: center; padding: 60px 20px; color: var(--text-light); }

.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 8px; font-size: .88rem; z-index: 999;
  box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: toastIn .25s ease;
}
.toast-info { background: #1b1b1b; color: #fff; }
.toast-error { background: var(--danger); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

@media (max-width: 600px) {
  .header { padding: 0 14px; }
  .main { padding: 16px 14px; }
  .post-item { padding: 14px 16px; }
  .post-content { padding: 16px; }
  .modal { padding: 22px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header" id="header">
  <div class="header-inner">
    <div class="header-left">
      <a href="javascript:showPostList()" class="site-title">Blue's Blog</a>
      <nav class="nav-links">
        <a href="javascript:showPostList()">文章</a>
        <a href="javascript:void(0)" onclick="toggleTokenBar()" id="admin-link" style="color:var(--text-light);font-size:.78rem;">管理</a>
      </nav>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="user-badge" id="user-badge" onclick="toggleUserMenu(event)">
        <div class="user-avatar" id="user-avatar-el">?</div>
        <span class="user-name" id="user-name-display"></span>
        <div class="user-dropdown" id="user-dropdown">
          <button class="tab" style="display:block;width:100%;text-align:left;padding:10px 16px;border:none;background:none;font-size:.85rem;color:var(--danger);" onclick="event.stopPropagation();doLogout()">退出登录</button>
        </div>
      </div>
      <button class="login-btn" id="login-btn" onclick="showLoginModal()">登录</button>
    </div>
  </div>
</header>

<!-- Admin Token Bar -->
<div class="token-bar" id="token-bar">
  <div class="token-bar-inner">
    <span class="admin-label">管理员 Token</span>
    <input type="password" id="token-input" placeholder="输入 GitHub Token...">
    <button class="save-btn" onclick="saveToken()">保存</button>
    <button class="clear-btn" onclick="clearToken()">清除</button>
  </div>
</div>

<!-- Main -->
<main class="main" id="main"></main>

<!-- Login Modal -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <h2 id="modal-title">登录</h2>
    <div class="tabs">
      <button class="tab active" onclick="switchLoginTab('login')">登录</button>
      <button class="tab" onclick="switchLoginTab('register')">注册</button>
    </div>

    <div class="tab-content active" id="tab-login">
      <div class="form-group"><label>邮箱</label><input type="email" id="login-email" placeholder="输入注册邮箱"></div>
      <div class="form-group"><label>密码</label><input type="password" id="login-password" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" onclick="closeLoginModal()">取消</button>
        <button class="btn btn-primary" id="login-submit" onclick="doLogin()">登录</button>
      </div>
      <p style="font-size:.8rem;color:var(--text-light);margin-top:10px;text-align:center;">没有账号？<a href="javascript:switchLoginTab('register')" style="color:var(--accent);cursor:pointer;">注册一个</a></p>
    </div>

    <div class="tab-content" id="tab-register">
      <div class="form-group"><label>用户名 *</label><input type="text" id="reg-username" placeholder="显示名称，2-20位"></div>
      <div class="form-group"><label>邮箱 *</label><input type="email" id="reg-email" placeholder="用于登录"></div>
      <div class="form-group"><label>密码 *</label><input type="password" id="reg-password" placeholder="至少6位"></div>
      <div class="form-group"><label>确认密码 *</label><input type="password" id="reg-password2" placeholder="再次输入" onkeydown="if(event.key==='Enter')doRegister()"></div>
      <div class="form-group">
        <label>QQ 号 <span style="color:var(--text-light);font-weight:400;">（选填，用于头像）</span></label>
        <input type="text" id="reg-qq" placeholder="输入 QQ 号获取头像" oninput="onRegQQInput()">
        <div id="reg-qq-preview" style="text-align:center;margin-top:6px;display:none;">
          <img id="reg-qq-img" src="" style="width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);" onerror="this.style.display='none';document.getElementById('reg-qq-preview').style.display='none';">
          <p style="font-size:.7rem;color:var(--text-light);">头像预览</p>
        </div>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" onclick="closeLoginModal()">取消</button>
        <button class="btn btn-primary" id="reg-submit" onclick="doRegister()">注册</button>
      </div>
      <p style="font-size:.78rem;color:var(--text-light);margin-top:10px;text-align:center;">已有账号？<a href="javascript:switchLoginTab('login')" style="color:var(--accent);cursor:pointer;">去登录</a></p>
    </div>
  </div>
</div>

<script>
/* ================================================================
   Config — Supabase
   ================================================================ */
const SB_URL = 'https://icqmextioewqhjdnzlsf.supabase.co';
const SB_KEY = 'sb_publishable_1z6dv8i9itwVQMWGt6TDug_XPoDFXxC';
const SB_AUTH = SB_URL + '/auth/v1';
const SB_REST = SB_URL + '/rest/v1';

/* ================================================================
   Supabase helpers
   ================================================================ */
function sbHeaders(token) {
  var h = { 'apikey': SB_KEY, 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}

function sbError(e) {
  if (!e) return '未知错误';
  if (typeof e === 'string') return e;
  if (e.message) return e.message;
  if (e.msg) return e.msg;
  if (e.error_description) return e.error_description;
  return JSON.stringify(e);
}

/* ================================================================
   Auth state (persisted in sessionStorage)
   ================================================================ */
let _sbSession = null;

function restoreSession() {
  try {
    var raw = sessionStorage.getItem('sb_session');
    if (raw) _sbSession = JSON.parse(raw);
  } catch(e) { _sbSession = null; }
}
restoreSession();

function saveSession(s) {
  _sbSession = s;
  sessionStorage.setItem('sb_session', JSON.stringify(s));
}

function clearSession() {
  _sbSession = null;
  sessionStorage.removeItem('sb_session');
}

function isLoggedIn() {
  return !!(_sbSession && _sbSession.access_token);
}

function getAccessToken() {
  return _sbSession ? _sbSession.access_token : null;
}

function getNickname() {
  if (_sbSession && _sbSession.user && _sbSession.user.user_metadata) {
    return _sbSession.user.user_metadata.username || '';
  }
  return '';
}

function getQQ() {
  if (_sbSession && _sbSession.user && _sbSession.user.user_metadata) {
    return _sbSession.user.user_metadata.qq || '';
  }
  return '';
}

function getUserId() {
  return _sbSession && _sbSession.user ? _sbSession.user.id : null;
}

function getQQAvatar() {
  var qq = getQQ();
  return /^\d{5,11}$/.test(qq) ? 'https://q.qlogo.cn/headimg_dl?dst_uin=' + qq + '&spec=100' : '';
}

function isAdmin() { return !!localStorage.getItem('gh_token'); }

/* ================================================================
   Toast
   ================================================================ */
function toast(msg, type) {
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 3000);
}

/* ================================================================
   UI: User badge & admin
   ================================================================ */
function updateAdminUI() {
  var badge = document.getElementById('user-badge');
  var loginBtn = document.getElementById('login-btn');
  var avatarEl = document.getElementById('user-avatar-el');
  var nameEl = document.getElementById('user-name-display');
  var adminCtrls = document.querySelector('.admin-controls');
  var adminLink = document.getElementById('admin-link');

  if (isAdmin()) {
    badge.style.display = 'inline-flex';
    loginBtn.style.display = 'none';
    avatarEl.innerHTML = 'A';
    nameEl.textContent = '管理员';
    adminLink.style.color = '#8d6e00';
    if (adminCtrls) adminCtrls.style.display = 'flex';
  } else if (isLoggedIn()) {
    badge.style.display = 'inline-flex';
    loginBtn.style.display = 'none';
    var nick = getNickname();
    var qqv = getQQAvatar();
    if (qqv) {
      avatarEl.innerHTML = '<img src="' + qqv + '" alt="">';
    } else {
      avatarEl.textContent = nick ? nick.charAt(0).toUpperCase() : '?';
    }
    nameEl.textContent = nick || '用户';
    adminLink.style.color = 'var(--text-light)';
    if (adminCtrls) adminCtrls.style.display = 'none';
  } else {
    badge.style.display = 'none';
    loginBtn.style.display = '';
    adminLink.style.color = 'var(--text-light)';
    if (adminCtrls) adminCtrls.style.display = 'none';
  }

  var tokenBar = document.getElementById('token-bar');
  var tokenInput = document.getElementById('token-input');
  if (tokenBar.style.display !== 'none') {
    tokenInput.value = localStorage.getItem('gh_token') || '';
  }
}

function toggleUserMenu(e) {
  e.stopPropagation();
  document.getElementById('user-badge').classList.toggle('open');
}
document.addEventListener('click', function() {
  document.getElementById('user-badge').classList.remove('open');
});

/* ================================================================
   Token bar
   ================================================================ */
function toggleTokenBar() {
  var bar = document.getElementById('token-bar');
  if (bar.style.display === 'block') {
    bar.style.display = 'none';
  } else {
    bar.style.display = 'block';
    document.getElementById('token-input').value = localStorage.getItem('gh_token') || '';
  }
}

function saveToken() {
  var token = document.getElementById('token-input').value.trim();
  if (!token) { toast('请输入 Token', 'error'); return; }
  localStorage.setItem('gh_token', token);
  toast('Token 已保存');
  updateAdminUI();
  refreshCurrent();
}

function clearToken() {
  localStorage.removeItem('gh_token');
  document.getElementById('token-input').value = '';
  toast('Token 已清除');
  updateAdminUI();
  refreshCurrent();
}

/* ================================================================
   Login Modal
   ================================================================ */
function showLoginModal() {
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('reg-username').value = '';
  document.getElementById('reg-email').value = '';
  document.getElementById('reg-password').value = '';
  document.getElementById('reg-password2').value = '';
  document.getElementById('reg-qq').value = getQQ();
  document.getElementById('reg-qq-preview').style.display = 'none';
  switchLoginTab('login');
  document.getElementById('login-modal').classList.add('active');
}

function closeLoginModal() {
  document.getElementById('login-modal').classList.remove('active');
}
document.getElementById('login-modal').addEventListener('click', function(e) {
  if (e.target === this) closeLoginModal();
});

function switchLoginTab(tab) {
  document.querySelectorAll('#login-modal .tab').forEach(function(t, i) {
    t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
  });
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

function onRegQQInput() {
  var qq = document.getElementById('reg-qq').value.trim();
  var preview = document.getElementById('reg-qq-preview');
  var img = document.getElementById('reg-qq-img');
  if (/^\d{5,11}$/.test(qq)) {
    img.src = 'https://q.qlogo.cn/headimg_dl?dst_uin=' + qq + '&spec=100';
    preview.style.display = '';
  } else {
    preview.style.display = 'none';
  }
}

/* ================================================================
   Auth: Login
   ================================================================ */
async function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value.trim();
  if (!email) { toast('请输入邮箱', 'error'); return; }
  if (!password) { toast('请输入密码', 'error'); return; }

  var btn = document.getElementById('login-submit');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    console.log('[SB] Login:', email);
    var resp = await fetch(SB_AUTH + '/token?grant_type=password', {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({ email: email, password: password })
    });
    var data = await resp.json();
    console.log('[SB] Login resp:', resp.status, data);

    if (!resp.ok) throw { message: data.error_description || data.msg || data.error || ('HTTP ' + resp.status) };
    if (!data.access_token) throw { message: '未获取到 access_token' };

    // Fetch full user info
    var userResp = await fetch(SB_AUTH + '/user', {
      headers: sbHeaders(data.access_token)
    });
    var userData = await userResp.json();
    if (userResp.ok && userData.id) {
      data.user = userData;
    }

    saveSession(data);
    console.log('[SB] Login OK:', data.user ? data.user.email : '?');
    closeLoginModal();
    updateAdminUI();
    refreshCurrent();
  } catch (e) {
    console.error('[SB] Login error:', e);
    var msg = sbError(e);
    if (msg.indexOf('Failed to fetch') !== -1) {
      toast('网络请求失败，请检查网络连接', 'error');
    } else if (msg.indexOf('invalid login') !== -1 || msg.indexOf('Invalid login') !== -1) {
      toast('邮箱或密码错误', 'error');
    } else if (msg.indexOf('Email not confirmed') !== -1) {
      toast('邮箱未验证，请先查收验证邮件', 'error');
    } else {
      toast('登录失败: ' + msg, 'error');
    }
  }
  btn.disabled = false; btn.textContent = '登录';
}

/* ================================================================
   Auth: Register (one-step, no OTP!)
   ================================================================ */
async function doRegister() {
  var username = document.getElementById('reg-username').value.trim();
  var email = document.getElementById('reg-email').value.trim();
  var password = document.getElementById('reg-password').value.trim();
  var password2 = document.getElementById('reg-password2').value.trim();
  var qq = document.getElementById('reg-qq').value.trim();

  if (!username) { toast('请输入用户名', 'error'); return; }
  if (username.length < 2 || username.length > 20) { toast('用户名长度 2-20 位', 'error'); return; }
  if (!email) { toast('请输入邮箱', 'error'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('邮箱格式不正确', 'error'); return; }
  if (!password) { toast('请输入密码', 'error'); return; }
  if (password.length < 6) { toast('密码至少 6 位', 'error'); return; }
  if (password !== password2) { toast('两次密码不一致', 'error'); return; }

  var btn = document.getElementById('reg-submit');
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    console.log('[SB] Register:', email, username);
    var resp = await fetch(SB_AUTH + '/signup', {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({
        email: email,
        password: password,
        data: {
          username: username,
          qq: /^\d{5,11}$/.test(qq) ? qq : ''
        }
      })
    });
    var data = await resp.json();
    console.log('[SB] Register resp:', resp.status, data);

    if (!resp.ok) throw { message: data.error_description || data.msg || data.error || ('HTTP ' + resp.status) };

    // Check if email confirmation is needed
    if (!data.session && !data.access_token) {
      // User created but needs email confirmation
      toast('注册成功！请查收邮箱验证邮件后登录。如未收到，请检查垃圾箱。');
      closeLoginModal();
      return;
    }

    // Auto-login (email confirmation disabled)
    saveSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
    console.log('[SB] Register + Login OK');
    toast('注册成功，已自动登录');
    closeLoginModal();
    updateAdminUI();
    refreshCurrent();
  } catch (e) {
    console.error('[SB] Register error:', e);
    var msg = sbError(e);
    if (msg.indexOf('already registered') !== -1 || msg.indexOf('already exists') !== -1) {
      toast('该邮箱已被注册', 'error');
    } else if (msg.indexOf('Failed to fetch') !== -1) {
      toast('网络请求失败，请检查网络连接', 'error');
    } else {
      toast('注册失败: ' + msg, 'error');
    }
  }
  btn.disabled = false; btn.textContent = '注册';
}

/* ================================================================
   Auth: Logout
   ================================================================ */
async function doLogout() {
  if (_sbSession && _sbSession.access_token) {
    try {
      await fetch(SB_AUTH + '/logout', {
        method: 'POST',
        headers: sbHeaders(_sbSession.access_token)
      });
    } catch(e) {}
  }
  clearSession();
  document.getElementById('user-badge').classList.remove('open');
  updateAdminUI();
  refreshCurrent();
}

/* ================================================================
   Posts: Fetch from GitHub Issues
   ================================================================ */
var REPO = 'BlauerVoge1/aiblog';
var ISSUES_API = 'https://api.github.com/repos/' + REPO + '/issues';
var PER_PAGE = 10;
var currentPage = 1;
var currentView = 'list';
var currentPost = null;
var allPosts = [];

function getToken() { return localStorage.getItem('gh_token') || ''; }

function apiHeaders() {
  var h = { 'Accept': 'application/vnd.github.v3+json' };
  var t = getToken();
  if (t) h['Authorization'] = 'token ' + t;
  return h;
}

async function fetchPosts(page) {
  var url = ISSUES_API + '?state=open&per_page=' + PER_PAGE + '&page=' + page + '&sort=created&direction=desc';
  var resp = await fetch(url, { headers: apiHeaders() });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return await resp.json();
}

function extractTags(issue) {
  var tags = [];
  if (issue.labels && issue.labels.length) {
    tags = issue.labels.map(function(l) { return l.name; });
  }
  return tags;
}

function parsePostMeta(body) {
  if (!body) return { excerpt: '', tags: [] };
  var lines = body.split('\n');
  var tags = [];
  var contentStart = 0;
  var firstLine = lines[0] || '';
  if (/^\[.+\]$/.test(firstLine)) {
    tags = firstLine.slice(1, -1).split(',').map(function(t) { return t.trim(); }).filter(Boolean);
    contentStart = 1;
  }
  var content = lines.slice(contentStart).join('\n').trim();
  var excerpt = content.replace(/[#*`>\[\]!]/g, '').substring(0, 200);
  return { excerpt: excerpt, tags: tags, content: content };
}

function renderPostList() {
  currentView = 'list';
  currentPost = null;
  var html = '<div class="admin-controls" id="admin-controls"></div>';
  html += '<div class="loading" id="post-loading">加载文章列表...</div>';
  html += '<div id="post-list"></div>';
  html += '<div class="page-info" id="page-info"></div>';
  document.getElementById('main').innerHTML = html;
  updateAdminUI();
  loadPosts(currentPage);
}

async function loadPosts(page) {
  currentPage = page;
  var loading = document.getElementById('post-loading');
  var listEl = document.getElementById('post-list');
  var pageEl = document.getElementById('page-info');
  loading.style.display = '';
  listEl.innerHTML = '';
  pageEl.innerHTML = '';

  try {
    var posts = await fetchPosts(page);
    allPosts = posts;
    loading.style.display = 'none';

    if (!posts.length) {
      listEl.innerHTML = '<div class="empty">暂无文章</div>';
      return;
    }

    posts.forEach(function(issue) {
      var meta = parsePostMeta(issue.body);
      var date = new Date(issue.created_at).toLocaleDateString('zh-CN');
      var commentsCount = issue.comments || 0;
      var tagsHtml = meta.tags.map(function(t) {
        return '<span class="post-tag">' + escapeHtml(t) + '</span>';
      }).join('');

      listEl.innerHTML +=
        '<div class="post-item" onclick="showPostDetail(' + issue.number + ')">' +
        '<h2>' + escapeHtml(issue.title) + '</h2>' +
        '<div class="post-meta">' +
        '<span>' + date + '</span>' +
        '<span>' + commentsCount + ' 条评论</span>' +
        '</div>' +
        (meta.excerpt ? '<p style="margin-top:6px;font-size:.85rem;color:var(--text-light);">' + escapeHtml(meta.excerpt) + '</p>' : '') +
        (tagsHtml ? '<div class="post-tags">' + tagsHtml + '</div>' : '') +
        '</div>';
    });

    if (posts.length === PER_PAGE || page > 1) {
      var navHtml = '';
      if (page > 1) navHtml += '<a href="javascript:void(0)" onclick="loadPosts(' + (page - 1) + ')" style="color:var(--accent);cursor:pointer;">← 上一页</a> ';
      navHtml += '<span>第 ' + page + ' 页</span>';
      if (posts.length === PER_PAGE) navHtml += ' <a href="javascript:void(0)" onclick="loadPosts(' + (page + 1) + ')" style="color:var(--accent);cursor:pointer;">下一页 →</a>';
      pageEl.innerHTML = navHtml;
    }
  } catch (e) {
    loading.style.display = 'none';
    listEl.innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
    console.error('Fetch posts error:', e);
  }
}

/* ================================================================
   Post Detail
   ================================================================ */
function showPostDetail(number) {
  var issue = allPosts.find(function(p) { return p.number === number; });
  if (!issue) return;

  currentView = 'detail';
  currentPost = issue;
  var meta = parsePostMeta(issue.body);
  var date = new Date(issue.created_at).toLocaleDateString('zh-CN');
  var tagsHtml = meta.tags.map(function(t) {
    return '<span class="post-tag">' + escapeHtml(t) + '</span>';
  }).join('');

  if (typeof marked === 'undefined') {
    meta.content = meta.content.replace(/</g, '&lt;').replace(/\n/g, '<br>');
  } else {
    meta.content = marked.parse(meta.content);
  }

  document.getElementById('main').innerHTML =
    '<div class="admin-controls" id="admin-controls"></div>' +
    '<a class="back-link" onclick="showPostList()">← 返回文章列表</a>' +
    '<div class="post-detail" style="display:block;">' +
    '<div class="post-detail-header">' +
    '<h1>' + escapeHtml(issue.title) + '</h1>' +
    '<div class="post-meta"><span>' + date + '</span></div>' +
    (tagsHtml ? '<div class="post-tags" style="margin-top:8px;">' + tagsHtml + '</div>' : '') +
    '</div>' +
    '<div class="post-content">' + meta.content + '</div>' +
    '<div class="comments-section" id="comments-section">' +
    '<h3>评论 (<span id="comment-count">0</span>)</h3>' +
    '<div id="comment-list"><div class="loading">加载评论...</div></div>' +
    '</div>' +
    '</div>';

  updateAdminUI();
  fetchComments(postIdFromIssue(issue));
}

function showPostList() {
  currentView = 'list';
  currentPost = null;
  renderPostList();
}

function refreshCurrent() {
  if (currentView === 'detail' && currentPost) {
    showPostDetail(currentPost.number);
  } else {
    renderPostList();
  }
}

function postIdFromIssue(issue) {
  return String(issue.number);
}

/* ================================================================
   Comments: Supabase REST API
   ================================================================ */
var COMMENTS_TABLE = 'comments';

async function fetchComments(postSlug) {
  var listEl = document.getElementById('comment-list');
  var countEl = document.getElementById('comment-count');

  try {
    var url = SB_REST + '/' + COMMENTS_TABLE
      + '?post_slug=eq.' + encodeURIComponent(postSlug)
      + '&select=*'
      + '&order=created_at.asc';

    var resp = await fetch(url, {
      headers: { 'apikey': SB_KEY }
    });

    if (!resp.ok) {
      var errText = await resp.text();
      throw { message: 'HTTP ' + resp.status + ' ' + errText };
    }

    var comments = await resp.json();
    console.log('[SB] Comments loaded:', comments.length);

    countEl.textContent = comments.length;

    if (!comments.length) {
      listEl.innerHTML = '<div style="padding:12px;color:var(--text-light);font-size:.88rem;">暂无评论，来说点什么吧</div>';
    } else {
      var html = '';
      comments.forEach(function(c) {
        var qq = c.qq || '';
        var avatarHtml = '';
        if (/^\d{5,11}$/.test(qq)) {
          avatarHtml = '<img src="https://q.qlogo.cn/headimg_dl?dst_uin=' + qq + '&spec=100" alt="">';
        } else {
          avatarHtml = (c.display_name || '?').charAt(0).toUpperCase();
        }
        var time = '';
        try { time = new Date(c.created_at).toLocaleString('zh-CN'); } catch(e) {}
        html +=
          '<div class="comment-item">' +
          '<div class="comment-header">' +
          '<div class="comment-avatar">' + avatarHtml + '</div>' +
          '<span class="comment-author">' + escapeHtml(c.display_name || '匿名') + '</span>' +
          '<span class="comment-time">' + time + '</span>' +
          '</div>' +
          '<div class="comment-body">' + escapeHtml(c.body || '') + '</div>' +
          '</div>';
      });
      listEl.innerHTML = html;
    }

    addCommentForm(postSlug);

  } catch (e) {
    console.error('[SB] Fetch comments error:', e);
    var msg = sbError(e).toLowerCase();
    if (msg.indexOf('does not exist') !== -1 || msg.indexOf('404') !== -1) {
      listEl.innerHTML = '<div class="empty">评论表未创建，请先在 Supabase 中运行建表 SQL</div>';
    } else {
      listEl.innerHTML = '<div class="empty">加载评论失败: ' + sbError(e) + '</div>';
    }
  }
}

function addCommentForm(postSlug) {
  var section = document.getElementById('comments-section');
  var formDiv = document.createElement('div');
  formDiv.className = 'comment-form';
  formDiv.id = 'comment-form';

  if (isLoggedIn()) {
    formDiv.innerHTML =
      '<textarea id="comment-input" placeholder="写下你的评论..."></textarea>' +
      '<div class="comment-actions">' +
      '<span class="comment-hint">以 <strong>' + escapeHtml(getNickname()) + '</strong> 的身份评论</span>' +
      '<button class="submit-btn" id="comment-submit" onclick="submitComment(\'' + postSlug + '\')">发表评论</button>' +
      '</div>';
  } else {
    formDiv.innerHTML =
      '<textarea id="comment-input" placeholder="登录后即可评论..." disabled></textarea>' +
      '<div class="comment-actions">' +
      '<span class="comment-hint"><a onclick="showLoginModal()">登录</a> 或 <a onclick="showLoginModal();switchLoginTab(\'register\')">注册</a> 后评论</span>' +
      '</div>';
  }
  section.appendChild(formDiv);
}

async function submitComment(postSlug) {
  if (!isLoggedIn()) { toast('请先登录', 'error'); showLoginModal(); return; }

  var input = document.getElementById('comment-input');
  var body = input.value.trim();
  if (!body) { toast('请输入评论内容', 'error'); return; }

  var btn = document.getElementById('comment-submit');
  btn.disabled = true; btn.textContent = '发表中...';

  var token = getAccessToken();
  try {
    var resp = await fetch(SB_REST + '/' + COMMENTS_TABLE, {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        post_slug: postSlug,
        user_id: getUserId(),
        display_name: getNickname(),
        qq: getQQ(),
        body: body,
        created_at: new Date().toISOString()
      })
    });

    if (!resp.ok) {
      var errData = await resp.json().catch(function() { return {}; });
      throw { message: errData.message || errData.msg || ('HTTP ' + resp.status) };
    }

    input.value = '';
    toast('评论发表成功');
    fetchComments(postSlug);
  } catch (e) {
    console.error('[SB] Comment error:', e);
    toast('评论失败: ' + sbError(e), 'error');
  }
  btn.disabled = false; btn.textContent = '发表评论';
}

/* ================================================================
   Utility
   ================================================================ */
function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ================================================================
   Init
   ================================================================ */
(function init() {
  // Restore session and verify it's still valid
  if (_sbSession && _sbSession.access_token) {
    fetch(SB_AUTH + '/user', {
      headers: sbHeaders(_sbSession.access_token)
    }).then(function(resp) {
      return resp.json().then(function(data) {
        if (resp.ok && data.id) {
          _sbSession.user = data;
          saveSession(_sbSession);
          console.log('[SB] Session restored:', data.email);
        } else {
          console.log('[SB] Session expired');
          clearSession();
        }
        renderPostList();
      });
    }).catch(function() {
      console.log('[SB] Session check failed');
      clearSession();
      renderPostList();
    });
  } else {
    console.log('[SB] No session to restore');
    renderPostList();
  }
})();
</script>
